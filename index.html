<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v=2 busts the browser's sticky favicon cache (rebrand to the coin mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SplitDec — Split expenses with friends</title>
    <meta
      name="description"
      content="Track who paid what on trips, with flatmates or at dinner, in any currency — and settle the whole group in the fewest transfers possible. Free, no ads, installs like an app."
    />
    <!-- Deliberately no <link rel="canonical">. Every route is rewritten to
         this one file, so a static canonical would declare /privacy and
         /terms duplicates of the landing page. Cross-host duplication with
         split-dec.vercel.app is handled by an X-Robots-Tag in vercel.json
         instead, which can vary per host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SplitDec" />
    <meta property="og:title" content="SplitDec — Split expenses, not friendships" />
    <meta
      property="og:description"
      content="Track who paid what in any currency, and settle the whole group in the fewest transfers possible."
    />
    <meta property="og:url" content="https://split-dec.app/" />
    <meta property="og:image" content="https://split-dec.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SplitDec — Split expenses, not friendships" />
    <meta
      name="twitter:description"
      content="Track who paid what in any currency, and settle the whole group in the fewest transfers possible."
    />
    <meta name="twitter:image" content="https://split-dec.app/icons/icon-512.png" />
    <script>
      // Apply the saved theme before React mounts to avoid a light-mode flash.
      try {
        var t = localStorage.getItem("splitdec.theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
