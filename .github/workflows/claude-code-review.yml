name: Claude Code Review

# Automatic review of every PR when it is opened or marked ready, and again on
# every push to an open one. Without `synchronize` the check attests only to
# the code as it was at open: fixes pushed in response to a review were never
# themselves reviewed, while the PR kept showing a green tick.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# One review at a time per PR. Pushes often arrive in bursts (a fix, then its
# test), and without this each starts a full review of a diff that is already
# stale — cost with nothing to show for it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Dependabot PRs get neither half of what this job needs. GitHub scopes
    # their secrets to the Dependabot store ("Secret source: Dependabot" in the
    # run log), so claude_code_oauth_token arrives empty; and dependabot[bot]
    # is not in allowed_bots below, so the actor would be refused even with a
    # token. The action then reports success having reviewed nothing, the guard
    # at the bottom of this file correctly fails the job, and every dependency
    # bump carries a permanent red check — which is the fastest way to train
    # everyone here to stop reading checks at all.
    #
    # Skipped rather than allow-listed, deliberately. Restoring the review
    # would mean copying the OAuth token into Dependabot secrets, and for
    # `pull_request` the workflow runs from the PR's own head — a Dependabot PR
    # can edit .github/workflows (#57 bumps action SHAs in this very file), so
    # that token would be reachable from a branch nobody here wrote. Withholding
    # it is the protection GitHub intends, not an oversight to work around. The
    # bumps are still gated by backend/frontend CI, which is the check that
    # actually decides whether a version change is safe.
    #
    # Keyed on the actor rather than the PR author on purpose: when a human
    # pushes a fix to a Dependabot branch, the `synchronize` event runs under
    # their name, secrets resolve normally, and the review happens as usual.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Already below the documented baseline (which is contents/issues write):
    # the reviewer only reads the diff and posts a verdict, so `pull-requests:
    # write` is the only write scope it gets. `id-token: write` (OIDC token
    # exchange) and `actions: read` (reading CI results on the PR) are both
    # required by claude-code-action — dropping them breaks the action, it
    # doesn't harden it.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      # Pinned to commit SHAs, not tags: this job holds a Claude OAuth token
      # and write access to pull requests, and a mutable tag lets whoever
      # controls the action repo re-point it at new code without a PR here.
      # Bump deliberately (the tag each SHA matched is in the trailing note).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      # Anchor for the check below. Taken before the reviewer runs so that a
      # comment left on an earlier run can't be mistaken for this one's.
      - name: Record start time
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Vercel's bot opens the PRs that install its own products (#36, #37,
          # #39), and the action rejects non-human actors by default, so the run
          # on `opened` fails having reviewed nothing. #36 and #37 only look
          # reviewed because a fix was later pushed to each branch and
          # `synchronize` re-ran the job under a human actor; nobody pushed to
          # #39, so it was never reviewed at all. That is exactly backwards — a
          # PR nobody here wrote by hand is the one least entitled to the
          # benefit of the doubt.
          #
          # Named explicitly rather than '*': this repo is public, and the
          # action's own warning is that '*' lets any external App invoke this
          # job with a prompt it controls. Matching lowercases both sides and
          # strips a trailing "[bot]", so this also covers the bare `vercel`
          # that the rejection message prints.
          allowed_bots: "vercel[bot]"
          # Supplying `prompt` puts the job in agent mode, which is what lets
          # it fire on a pull_request event with no @claude mention ("Auto-
          # detected mode: agent for event: pull_request" in the run log).
          #
          # track_progress/use_sticky_comment are deliberately NOT set. They
          # would move the job to tag mode, and this job has no way to test
          # that change: the action refuses to run whenever this file differs
          # from the copy on the default branch (see the guard step below), so
          # a PR editing it can never exercise the reviewer. Changing modes
          # blind, on the job that reviews everything else, is not a trade
          # worth taking — the recovery step below repairs the failure they
          # were meant to fix, and does it without changing modes.
          prompt: |
            Review this pull request for the SplitDec app (FastAPI + React
            Splitwise clone). Read README.md, CLAUDE.md, and
            "SplitDec - specification.md" for architecture and invariants,
            and read any other source files you need for real context — do
            not review the diff in isolation; verify claims against how the
            surrounding code and existing tests actually behave.

            ## Correctness
            - Money/balance math: NUMERIC(14,4) precision, banker's rounding
              at the currency's own precision (currencies.py), remainder
              distribution, amounts serialized as strings end-to-end (never
              floats).
            - Concurrency: the group-row-lock protocol (FOR SHARE / FOR
              UPDATE via deps.py) — does every new balance-changing endpoint
              join it, and is the lock taken before balances are read?
            - Idempotency: Idempotency-Key replay scoping (must be scoped to
              the path group — cross-group key reuse was a real prior bug
              class here).
            - Soft-deletes: are deleted expenses/settlements excluded from
              balance queries and listings, independently of each other?
            - Test coverage: are new endpoints/branches covered, especially
              anything that only breaks under concurrent access (Postgres-
              only tests) or at currency-precision edges (JPY=0, KWD=3, ...).

            ## Security — review this as if it will face hostile input
            - Authorization: FastAPI is the SOLE authz boundary (RLS is
              intentionally disabled). Check every new/changed endpoint for
              missing or wrong membership checks, and for IDOR — can a user
              reach another user's group, expense, settlement, or account
              data by supplying an id they don't own?
            - Mass assignment: do request schemas let a client set fields it
              shouldn't (ids, ownership, timestamps, soft-delete flags)?
            - Auth/JWT: for anything touching auth.py, confirm the signature
              algorithm is pinned (no algorithm-confusion / "alg: none"),
              JWKS is fetched over verified TLS, and expiry/audience/issuer
              checks aren't weakened.
            - Injection: string-built SQL, or command/shell injection in any
              subprocess usage.
            - Secrets & disclosure: no secrets, tokens, or raw stack traces
              in responses, logs, or error messages; no PII in log lines.
            - Email: invitation content must stay HTML-escaped
              (invitation_email_content) — check any new user-controlled
              field that flows into an email body.
            - Frontend: flag dangerouslySetInnerHTML, unescaped user content,
              or open-redirect risk in auth/redirect flows.
            - Dependencies: flag any new dependency that's unusual, unpinned,
              or unnecessary for the change.
            - Config: dev-only relaxations (CORS, debug flags) must stay
              gated on ENV=development and never leak into production.

            Leave concise inline comments only on problems you're actually
            confident about — do not comment on style, naming, or
            formatting. Mark any security finding's severity (blocking vs.
            minor).

            Post an overall verdict as a PR comment (`gh pr comment`) as soon
            as you have one — BEFORE writing inline comments, not after. Even
            "reviewed, no issues found" is required output, not optional.
            Posting first is what saves the review from a run that later runs
            short of turns or context: a verdict left as your final message is
            discarded when the job ends.

            Write the body to a file and pass `--body-file`; you have the
            Write tool for exactly that. Do not pipe a heredoc into `gh` — a
            command starting with anything other than `gh pr comment` is
            denied, and every denial costs you a turn.

            Post the comment even if you were denied tools, ran short of
            context, or are unsure — say so in the comment. A step after this
            one fails the build if no verdict appears.
          # Wider than the reviewer strictly needs to *read* the diff, because
          # the prompt asks it to verify claims against surrounding code and
          # history — and every call outside this list costs a turn to be
          # denied. The run that failed to post on PR #29 burned 7 of its 13
          # turns on denials; the one that succeeded burned 22 of 49; the one
          # that failed on #74 burned 14 of 24 and stopped without a verdict.
          #
          # `Write` is on the list for one reason: posting a multi-line verdict
          # means `gh pr comment --body-file`, and with no way to create a file
          # the reviewer reaches for `cat <<EOF | gh pr comment`, which starts
          # with `cat` and is refused. It is the denial that costs the whole
          # review. Still read-only where it counts: this job has
          # `contents: read` and pushes nothing, so a write only touches the
          # runner's throwaway disk. The plain shell verbs are here because the
          # reviewer reaches for them out of habit instead of Read/Grep.
          #
          # Kept on one line on purpose: a folded scalar (>-) would join the
          # continuations with spaces, and " Bash(git log:*)" is not the same
          # tool name as "Bash(git log:*)".
          claude_args: '--allowed-tools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(rg:*)"'

      # The verdict is the reviewer's final message, and that message is
      # thrown away when the job ends unless the reviewer managed to run
      # `gh pr comment` itself. On PR #74 it did not: 14 of its 24 turns went
      # on denied tool calls and it stopped without posting, so a review that
      # had genuinely been done was lost and the check went red on what a
      # re-run then turned green with no code change. The action writes the
      # whole run to disk, final message included, so take the verdict from
      # there rather than depending on the agent getting a shell invocation
      # right.
      #
      # A fallback and nothing more. If the reviewer posted, this does
      # nothing; if there is no verdict to recover, it posts nothing and
      # leaves the guard below to fail the build. A green check standing on a
      # review nobody wrote is the failure this file exists to prevent, and
      # recovering silence into a comment would be exactly that.
      - name: Recover the verdict if the reviewer could not post it
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -euo pipefail

          # The action publishes the path as an output; RUNNER_TEMP is where it
          # has always landed, kept as a fallback so an output rename degrades
          # to a red check rather than a silent one.
          log="${EXECUTION_FILE:-}"
          if [ -z "$log" ] || [ ! -f "$log" ]; then
            log="$RUNNER_TEMP/claude-execution-output.json"
          fi

          # Extraction runs on every job, including the ones where the reviewer
          # posted for itself and nothing needs recovering. That is deliberate:
          # this path only matters on the day it is needed, and a filter that
          # has quietly stopped matching the log format would not be discovered
          # until then. Every run now says whether it *could* have recovered a
          # verdict, so the answer is in the log of the last green build rather
          # than in the first red one.
          #
          # Slurped, so the same filter works whether the log is one JSON array
          # or one object per line; try/catch so an unexpected shape yields
          # nothing instead of failing the step. The last block of assistant
          # text is the verdict the run ended on.
          if [ -f "$log" ]; then
            jq -s -r '
              [ .. | objects
                | select(.type == "assistant")
                | try (.message.content[] | select(.type == "text") | .text)
                  catch empty ]
              | last // ""
            ' "$log" > "$RUNNER_TEMP/verdict.txt" || true
          fi
          [ -f "$RUNNER_TEMP/verdict.txt" ] || : > "$RUNNER_TEMP/verdict.txt"
          echo "Recoverable verdict: $(wc -c < "$RUNNER_TEMP/verdict.txt") bytes from ${log:-no log}."

          already=$(gh api \
            "repos/${{ github.repository }}/issues/$PR/comments?since=$REVIEW_STARTED_AT&per_page=100" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length')
          if [ "$already" -ne 0 ]; then
            echo "The reviewer posted its own verdict; nothing to recover."
            exit 0
          fi

          if [ ! -s "$RUNNER_TEMP/verdict.txt" ]; then
            echo "::warning::No verdict could be recovered from the run log."
            exit 0
          fi

          # The marker is what the guard below matches on, and it is only
          # trusted together with the author: this posts as github-actions[bot],
          # which nobody opening a PR against a public repo can impersonate. A
          # marker alone would let anyone turn the check green by pasting it
          # into a comment of their own.
          {
            echo '<!-- claude-review-recovered -->'
            echo '> **Recovered from the run log.** The reviewer wrote this verdict'
            echo '> but could not post it itself — its `gh` call was denied. The'
            echo '> workflow posted it so the review is not lost. Treat it as the'
            echo '> reviewer'"'"'s own output, and note that any inline comments it'
            echo '> meant to leave are probably missing.'
            echo
            # -c drops a trailing partial character, since the cut is by bytes.
            head -c 60000 "$RUNNER_TEMP/verdict.txt" | iconv -f utf-8 -t utf-8 -c
            if [ "$(wc -c < "$RUNNER_TEMP/verdict.txt")" -gt 60000 ]; then
              echo
              echo '_(truncated — the full text is in the run log)_'
            fi
          } > "$RUNNER_TEMP/recovered-comment.md"

          gh pr comment "$PR" --body-file "$RUNNER_TEMP/recovered-comment.md"
          echo "Recovered the verdict from the run log and posted it."

      # The action reports success even when it reviews nothing and posts
      # nothing — that is exactly what happened on PR #29, and a green tick
      # with no review behind it is worse than a red one, because it reads as
      # "reviewed, no issues". Turn that silence into a failure.
      #
      # Only runs when the reviewer step itself succeeded: if it failed, the
      # job is already red and a second error adds nothing.
      - name: Fail if no review was posted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # A PR that edits this file cannot be reviewed by it: the action
          # requires the workflow to match the default branch's copy, so that
          # a PR can't rewrite the reviewer (which holds an OAuth token) and
          # have the rewrite run. Warn and pass, or this step would pin a
          # permanent red check on every workflow change.
          #
          # The contents API returns the git blob SHA, so reading the blob out
          # of HEAD compares content without fetching the base branch. Read
          # from the commit rather than hashing the file on disk: that way no
          # checkout filter or EOL normalisation can shift the hash.
          head_blob=$(git rev-parse "HEAD:.github/workflows/claude-code-review.yml")
          base_blob=$(gh api \
            "repos/${{ github.repository }}/contents/.github/workflows/claude-code-review.yml?ref=$BASE_REF" \
            --jq .sha 2>/dev/null || echo "missing")
          if [ "$head_blob" != "$base_blob" ]; then
            echo "::warning::This PR changes the review workflow, so the action skipped itself (it only runs when the file matches $BASE_REF). No review to check for. The change takes effect for PRs opened after this one merges."
            exit 0
          fi

          # `since` is the API's own filter, so this asks only for comments
          # newer than the anchor. Note: no --paginate — combined with --jq it
          # prints one count per page, and `[ "$posted" -eq 0 ]` would then be
          # comparing a multi-line string. `since` keeps the result to a
          # handful, well inside one page.
          #
          # Either the reviewer's own comment, or one the step above recovered
          # from the run log. The recovered one is recognised by its marker
          # *and* its author: github-actions[bot] is not something a PR author
          # can post as, so pasting the marker into a comment does not buy a
          # green check.
          posted=$(gh api \
            "repos/${{ github.repository }}/issues/$PR/comments?since=$REVIEW_STARTED_AT&per_page=100" \
            --jq '[.[] | select(
                    .user.login == "claude[bot]"
                    or (.user.login == "github-actions[bot]"
                        and ((.body // "") | contains("<!-- claude-review-recovered -->")))
                  )] | length')
          if [ "$posted" -eq 0 ]; then
            echo "::error::Claude Code Review posted no comment, and no verdict could be recovered from the run log. Failing rather than showing a green check that looks like a clean review — see PR #29 for this exact failure mode."
            exit 1
          fi
          echo "Review posted ($posted comment(s) since $REVIEW_STARTED_AT)."
