# Pinning without a bump process just means running old code on purpose:
# requirements.txt and package-lock.json now hold exact versions, so nothing
# updates itself any more. These are the PRs that replace that drift — reviewed,
# tested by CI, and merged deliberately instead of arriving at deploy time.
#
# Grouped on purpose. Ungrouped, a weekly run on ~500 npm packages and ~40
# Python ones opens a PR per package and the whole thing gets muted within a
# month. One PR per ecosystem per week is something a solo maintainer reads.
# Majors stay ungrouped, because those are the ones worth looking at alone.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Action versions are pinned to majors (actions/checkout@v7), so this is a
  # low-traffic feed — monthly is plenty, and one grouped PR covers it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
